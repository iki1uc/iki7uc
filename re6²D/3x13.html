<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3×13 – ALL4ALL MASTER / UPG‑X / RAW‑BORG</title>
<style>
  body{
    margin:0;
    background:#000;
    color:#0ff;
    font-family:monospace;
    padding:20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(13,70px);
    grid-template-rows:repeat(3,40px);
    gap:4px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #033;
    cursor:pointer;
    font-size:11px;
  }
  #out{
    margin-top:16px;
    white-space:pre;
  }
  .bar{
    margin-bottom:10px;
  }
  button{
    background:#022;
    color:#0ff;
    border:1px solid #044;
    padding:4px 8px;
    margin-right:6px;
    cursor:pointer;
    font-family:monospace;
    font-size:11px;
  }
  button.active{
    border-color:#0ff;
  }
  #all4all{
    margin-top:10px;
    font-size:11px;
    color:#0aa;
    white-space:pre;
  }
</style>
</head>
<body>

<h2>3×13 – ALL4ALL MASTER / UPG‑X</h2>

<div class="bar">
  SOURCE:
  <button data-src="3x2">3×2 (F°)</button>
  <button data-src="3x6">3×6 (L°‑Flow)</button>
  <button data-src="3x7">3×7 (L°‑Welt)</button>
</div>

<div class="grid" id="grid"></div>
<pre id="out">ALL4ALL MASTER READY (1‑gegen‑1 GEN‑Modus)</pre>
<pre id="all4all">[ALL4ALL] noch keine Anker gesetzt.</pre>

<script>
// ======================================================
// GEN‑QUELLEN (werden von 3×2 / 3×6 / 3×7 gefüttert)
// ======================================================
window.genSources = window.genSources || {};
let activeSourceKey = "3x2"; // Default

// ======================================================
// RAW‑BORG‑CHECK
// ======================================================
function rawBorgCheck(sig){
  if(!sig) return { status:"NONE", msg:"kein Signal" };

  if(!sig.flow && !sig.chain){
    return { status:"RAW", msg:"RAW‑Signal ohne Flow/Kette" };
  }

  if(sig.move === "NV" || sig.move === "SG" || sig.move === "HX"){
    return { status:"WARN", msg:"kritischer Move (NV/SG/HX)" };
  }

  return { status:"OK", msg:"BORG‑kompatibel" };
}

// ======================================================
// 3×13 – IDs
// ======================================================
const ROW_TAGS = ["R","F","X"]; // symbolisch
const COL_COUNT = 13;

function makeSuperId(row, col){
  const tag = ROW_TAGS[row];
  const num = String(col+1).padStart(2,"0");
  return `⟡${tag}${num}`;
}

// ======================================================
// ALL4ALL MASTER – ANKER‑OPERATOR
// ======================================================
const anchorLog = []; // globale Liste aller Anker

function ANKER_UPGX(row, col, sourceKey){
  const sid = makeSuperId(row, col);
  const incoming = window.genSources[sourceKey] || null;
  const borg = rawBorgCheck(incoming);

  const anchor = {
    sid,
    move: "AN",
    func: "ALL4ALL",
    axisExit: true,
    sourceKey,
    borgStatus: borg,
    source: incoming,
    t: Date.now()
  };

  anchorLog.push(anchor);
  updateAll4AllPanel();
  return anchor;
}

// ======================================================
// ALL4ALL‑PANEL (Master‑Übersicht)
// ======================================================
const all4all = document.getElementById("all4all");

function updateAll4AllPanel(){
  if(anchorLog.length === 0){
    all4all.textContent = "[ALL4ALL] noch keine Anker gesetzt.";
    return;
  }

  const counts = { "3x2":0, "3x6":0, "3x7":0, other:0 };
  anchorLog.forEach(a=>{
    if(counts[a.sourceKey] !== undefined) counts[a.sourceKey]++; else counts.other++;
  });

  const last = anchorLog[anchorLog.length-1];

  all4all.textContent =
`[ALL4ALL MASTER]
Total Anker: ${anchorLog.length}
3×2 (F°):    ${counts["3x2"]}
3×6 (L°‑F):  ${counts["3x6"]}
3×7 (L°‑W):  ${counts["3x7"]}
OTHER:       ${counts.other}

Letzter Anker:
  SID=${last.sid}
  SRC=${last.sourceKey}
  BORG=${last.borgStatus.status}`;
}

// ======================================================
// UI – Source‑Buttons
// ======================================================
const out  = document.getElementById("out");
const grid = document.getElementById("grid");
const srcButtons = document.querySelectorAll("button[data-src]");

srcButtons.forEach(btn=>{
  btn.onclick = ()=>{
    srcButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeSourceKey = btn.dataset.src;
    out.textContent = `ALL4ALL MASTER READY – aktive Quelle: ${activeSourceKey}`;
  };
});
srcButtons[0].classList.add("active");

// ======================================================
// UI – 3×13‑Grid
// ======================================================
for(let r=0;r<3;r++){
  for(let c=0;c<COL_COUNT;c++){
    const div = document.createElement("div");
    const sid = makeSuperId(r,c);
    div.className = "cell";
    div.textContent = sid;

    div.onclick = ()=>{
      const anchor = ANKER_UPGX(r, c, activeSourceKey);

      out.textContent =
`[3×13 UPG‑X ANKER]
SID=${anchor.sid}
MOVE=${anchor.move}
FUNC=${anchor.func}
AXIS_EXIT=${anchor.axisExit}

SOURCE_KEY=${anchor.sourceKey}
BORG_STATUS=${anchor.borgStatus.status}
BORG_MSG=${anchor.borgStatus.msg}

SOURCE_PAYLOAD=${
  anchor.source
    ? JSON.stringify(anchor.source, null, 2)
    : "none (GEN‑Quelle hat noch nichts geliefert)"
}`;
    };

    grid.appendChild(div);
  }
}
</script>
</body>
</html>
