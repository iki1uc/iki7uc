<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3×13 – GEN ANKER / ALL4ALL</title>
<style>
  body{
    margin:0;
    background:#000;
    color:#0ff;
    font-family:monospace;
    padding:20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(13,70px);
    grid-template-rows:repeat(3,40px);
    gap:4px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #033;
    cursor:pointer;
    font-size:11px;
  }
  #out{
    margin-top:16px;
    white-space:pre;
  }
</style>
</head>
<body>

<h2>3×13 – GEN ANKER / ALL4ALL</h2>
<div class="grid" id="grid"></div>
<pre id="out">GEN-ANKER READY</pre>

<script>
// ======================================================
// 3×13 – ANKER / ALL4ALL / AXIS-EXIT
// ======================================================

// 3 Reihen: R / F / L+E (nur symbolisch, keine harte Bindung)
const ROW_TAGS = ["R","F","X"]; // X = L+E / Welt+Engine

// 13 Spalten: reine Anker-Slots
const COL_COUNT = 13;

// SUPER-ID: ⟡R01..⟡R13, ⟡F01..⟡F13, ⟡X01..⟡X13
function makeSuperId(row, col){
  const tag = ROW_TAGS[row];
  const num = String(col+1).padStart(2,"0");
  return `⟡${tag}${num}`;
}

// ANKER-MOVE: alles ist AN / ALL4ALL
const MOVE_ANCHOR = "AN";
const FUNC_ALL4ALL = "ALL4ALL";

// GLOBAL: letzter Eingang aus 3×N (von außen)
window.lastSignal = window.lastSignal || null;

// ======================================================
// CORE: ANKER-OPERATOR
// nimmt ein beliebiges Signal r_in (von 3×1..3×N)
// und verankert es in einem 3×13-Slot
// ======================================================
function ANKER_OP(row, col, incoming){
  const sid = makeSuperId(row, col);

  // axisExit: wenn true → Achsen werden bewusst ignoriert
  const axisExit = true;

  const anchor = {
    sid,
    move: MOVE_ANCHOR,
    func: FUNC_ALL4ALL,
    axisExit,
    // Original-Signal aus 3×N:
    source: incoming || null
  };

  return anchor;
}

// ======================================================
// UI
// ======================================================
const grid = document.getElementById("grid");
const out  = document.getElementById("out");

for(let r=0;r<3;r++){
  for(let c=0;c<COL_COUNT;c++){
    const div = document.createElement("div");
    const sid = makeSuperId(r,c);
    div.className = "cell";
    div.textContent = sid;

    div.onclick = ()=>{
      const anchor = ANKER_OP(r, c, window.lastSignal);

      out.textContent =
`[3×13 ANKER]
SID=${anchor.sid}
MOVE=${anchor.move}
FUNC=${anchor.func}
AXIS_EXIT=${anchor.axisExit}

SOURCE=${anchor.source ? JSON.stringify(anchor.source,null,2) : "none"}`;
    };

    grid.appendChild(div);
  }
}

// ======================================================
// EXTERNER HOOK:
// andere 3×N-Module können hierher schreiben:
// window.lastSignal = { sid, move, axis1, axis2, flow, ... }
// ======================================================

</script>
</body>
</html>
