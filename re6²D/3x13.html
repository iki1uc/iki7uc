<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3×13 – UPG‑X ANKER / ALL4ALL / RAW‑BORG</title>
<style>
  body{
    margin:0;
    background:#000;
    color:#0ff;
    font-family:monospace;
    padding:20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(13,70px);
    grid-template-rows:repeat(3,40px);
    gap:4px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #033;
    cursor:pointer;
    font-size:11px;
  }
  #out{
    margin-top:16px;
    white-space:pre;
  }
  .bar{
    margin-bottom:10px;
  }
  button{
    background:#022;
    color:#0ff;
    border:1px solid #044;
    padding:4px 8px;
    margin-right:6px;
    cursor:pointer;
    font-family:monospace;
    font-size:11px;
  }
  button.active{
    border-color:#0ff;
  }
</style>
</head>
<body>

<h2>3×13 – UPG‑X / ANKER / ALL4ALL</h2>

<div class="bar">
  SOURCE:
  <button data-src="3x2">3×2 (F°)</button>
  <button data-src="3x6">3×6 (L°‑Flow)</button>
  <button data-src="3x7">3×7 (L°‑Welt)</button>
</div>

<div class="grid" id="grid"></div>
<pre id="out">UPG‑X ANKER READY (1‑gegen‑1 GEN‑Modus)</pre>

<script>
// ======================================================
// UMGEBUNG: GEN‑QUELLEN (werden von 3×2 / 3×6 / 3×7 gefüttert)
// ======================================================
// Erwartet wird, dass andere Module sowas setzen:
// window.genSources["3x2"] = { sid, move, axis1, axis2, flow, ... }
// window.genSources["3x6"] = { ... }
// window.genSources["3x7"] = { ... }

window.genSources = window.genSources || {};
let activeSourceKey = "3x2"; // Default: 3×2

// ======================================================
// RAW‑BORG‑CHECK (leicht, nur Status‑Tagging)
// ======================================================
function rawBorgCheck(sig){
  if(!sig) return { status:"NONE", msg:"kein Signal" };

  if(!sig.flow && !sig.chain){
    return { status:"RAW", msg:"RAW‑Signal ohne Flow/Kette" };
  }

  if(sig.move === "NV" || sig.move === "SG" || sig.move === "HX"){
    return { status:"WARN", msg:"kritischer Move (NV/SG/HX)" };
  }

  return { status:"OK", msg:"BORG‑kompatibel" };
}

// ======================================================
// 3×13 – IDs
// ======================================================
const ROW_TAGS = ["R","F","X"]; // R° / F° / L°+E° symbolisch
const COL_COUNT = 13;

function makeSuperId(row, col){
  const tag = ROW_TAGS[row];
  const num = String(col+1).padStart(2,"0");
  return `⟡${tag}${num}`;
}

// ======================================================
// UPG‑X ANKER‑OPERATOR
// – Achsen verlassen (axisExit = true)
// – ALL4ALL‑Funktion
// – 1‑gegen‑1: genau EINE GEN‑Quelle pro Anker
// ======================================================
function ANKER_UPGX(row, col, sourceKey){
  const sid = makeSuperId(row, col);
  const incoming = window.genSources[sourceKey] || null;

  const borg = rawBorgCheck(incoming);

  const anchor = {
    sid,
    move: "AN",          // reiner Anker
    func: "ALL4ALL",     // ALL4ALL‑Träger
    axisExit: true,      // Achsen verlassen
    sourceKey,           // welche GEN‑Quelle
    borgStatus: borg,    // RAW/BORG‑Tag
    source: incoming     // Original‑Signal (unvermischt)
  };

  return anchor;
}

// ======================================================
// UI – Source‑Buttons
// ======================================================
const out  = document.getElementById("out");
const grid = document.getElementById("grid");
const srcButtons = document.querySelectorAll("button[data-src]");

srcButtons.forEach(btn=>{
  btn.onclick = ()=>{
    srcButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeSourceKey = btn.dataset.src;
    out.textContent = `UPG‑X ANKER READY – aktive Quelle: ${activeSourceKey}`;
  };
});
srcButtons[0].classList.add("active");

// ======================================================
// UI – 3×13‑Grid
// ======================================================
for(let r=0;r<3;r++){
  for(let c=0;c<COL_COUNT;c++){
    const div = document.createElement("div");
    const sid = makeSuperId(r,c);
    div.className = "cell";
    div.textContent = sid;

    div.onclick = ()=>{
      const anchor = ANKER_UPGX(r, c, activeSourceKey);

      out.textContent =
`[3×13 UPG‑X ANKER]
SID=${anchor.sid}
MOVE=${anchor.move}
FUNC=${anchor.func}
AXIS_EXIT=${anchor.axisExit}

SOURCE_KEY=${anchor.sourceKey}
BORG_STATUS=${anchor.borgStatus.status}
BORG_MSG=${anchor.borgStatus.msg}

SOURCE_PAYLOAD=${
  anchor.source
    ? JSON.stringify(anchor.source, null, 2)
    : "none (GEN‑Quelle hat noch nichts geliefert)"
}`;
    };

    grid.appendChild(div);
  }
}
</script>
</body>
</html>
