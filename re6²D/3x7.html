// ------------------------------------------------------
// BORG PROTOCOL (Maßnahmen)
// ------------------------------------------------------
function borgProtocol(r){
  const result = { status:"OK", action:"", message:"" };

  if(!r.flow){
    result.status = "ERROR";
    result.action = "ADD_FLOW";
    result.message = "Unvollständige Sequenz erkannt. Ergänzung erforderlich.";
    return result;
  }

  if(!r.axis1 || !r.axis2){
    result.status = "ERROR";
    result.action = "ADD_AXIS";
    result.message = "Achsenkohärenz fehlt. Struktur instabil.";
    return result;
  }

  if(r.move === "NV" || r.move === "SG" || r.move === "HX"){
    result.status = "WARN";
    result.action = "CHECK_PATH";
    result.message = "Fehlstelle lokalisiert. Kohärenz bricht. Reparatur empfohlen.";
    return result;
  }

  if(r.move === "AN" || r.move === "SC" || r.move === "END"){
    result.status = "OK";
    result.action = "CONTINUE";
    result.message = "Sequenz stabil. Fortfahren.";
    return result;
  }

  result.status = "INFO";
  result.action = "ANALYZE";
  result.message = "Analyse läuft. Kontext wird eingefordert.";
  return result;
}

// ------------------------------------------------------
// MEER / SYNCH-KERN (Komplettum)
// ------------------------------------------------------
function synchKern(r){
  const sync = { status:"OK", message:"" };

  if(!r.flow){
    sync.status = "BREAK";
    sync.message = "Meer-Kohärenz unterbrochen. Flow fehlt.";
    return sync;
  }

  if(!r.axis1 || !r.axis2){
    sync.status = "DRIFT";
    sync.message = "Achsen-Drift erkannt. Meer instabil.";
    return sync;
  }

  if(r.move === "NV" || r.move === "SG" || r.move === "HX"){
    sync.status = "DARK";
    sync.message = "Dunkelzone im Meer. Vorsicht.";
    return sync;
  }

  sync.status = "LIGHT";
  sync.message = "Meer stabil. Komplettum aktiv.";
  return sync;
}
