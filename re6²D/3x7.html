<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3×7 – Weltmatrix</title>
<style>
  body{background:#000;color:#0ff;font-family:monospace;padding:20px;}
  .cell{padding:6px;margin:4px;border:1px solid #033;display:inline-block;width:90px;text-align:center;}
</style>
</head>
<body>

<h2>3×7 – WELT‑MATRIX</h2>
<div id="grid"></div>
<pre id="out">READY</pre>

<script>
// Achsen
const AXIS = ["I","Z","W"];

// Zustände
const STATES = ["AN","SC","NV","ST","SG","HX","END"];

// Weltmarker
function worldMarker(move){
  if(move==="AN"||move==="SC"||move==="END") return "⟡L+";
  if(move==="NV"||move==="SG"||move==="HX") return "⟡L-";
  return "";
}

// Matrix erzeugen
const grid=document.getElementById("grid");
const out=document.getElementById("out");

STATES.forEach(state=>{
  AXIS.forEach(axis=>{
    const d=document.createElement("div");
    d.className="cell";
    d.textContent = state + " " + worldMarker(state);
    d.onclick = ()=>{ out.textContent = `${axis}\n${state}\n${worldMarker(state)}` };
    grid.appendChild(d);
  });
});
</script>

</body>
</html>
