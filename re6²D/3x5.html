<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAWWATOR – 3×5</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#020617;
    color:#e5e7eb;
    font-family:system-ui,sans-serif;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,70px);
    grid-template-rows:repeat(3,70px);
    gap:8px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:#0b1120;
    border:1px solid #1f2937;
    cursor:pointer;
    font-size:16px;
    transition:.15s;
  }
  .cell:hover{
    background:#111827;
    border-color:#38bdf8;
    color:#e0f2fe;
  }
  #out{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    font-family:monospace;
    font-size:14px;
    color:#a5f3fc;
  }
</style>
</head>
<body>

<div class="grid" id="grid"></div>
<div id="out">RAWWATOR 3×5: ready.</div>

<script>
// RAWWATOR – 3×5 FULL COVERAGE

const SUPER_IDS = [
  "⟡A1","⟡A2","⟡A3","⟡A4","⟡A5",
  "⟡B1","⟡B2","⟡B3","⟡B4","⟡B5",
  "⟡C1","⟡C2","⟡C3","⟡C4","⟡C5"
];

// 15 Moves (voll Abdeckung aus deinem Set)
const MOVES15 = [
  "AN","SC","NV","ST","SG",
  "HX","MX","IQ","AL","SH",
  "CU","MO","PI","AX","BC"
];

// Funktions-Matrix (nur iki7uc-Paper, du kannst Namen anpassen)
const FUNKTION = {
  "⟡A1":"SHIFT",
  "⟡A2":"TECHMAP",
  "⟡A3":"EVENTS",
  "⟡A4":"MAERCHEN",
  "⟡A5":"PIPELINE",

  "⟡B1":"ALL4ALL",
  "⟡B2":"ANKER",
  "⟡B3":"MAXI4D",
  "⟡B4":"CUBE-LIVE",
  "⟡B5":"RENDER",

  "⟡C1":"TECH_6IY",
  "⟡C2":"TECH_NIEX8",
  "⟡C3":"SHINE",
  "⟡C4":"META",
  "⟡C5":"LIVE"
};

// 3×5 → 15 Achsen (3 primär × 5 sekundär)
const AXIS_PRIMARY   = ["I","Z","W"];            // Impuls, Zustand, Wirkung
const AXIS_SECONDARY = ["K","T","P","R","S"];    // Kontext, Zeit, Perspektive, Rotation, Spektrum

function OP15(index){
  const row = Math.floor(index / 5);   // 0..2
  const col = index % 5;               // 0..4

  const superID = SUPER_IDS[index];
  const move    = MOVES15[index];
  const axis1   = AXIS_PRIMARY[row];
  const axis2   = AXIS_SECONDARY[col];
  const func    = FUNKTION[superID];

  return { superID, move, axis1, axis2, func };
}

// UI
const grid = document.getElementById("grid");
const out  = document.getElementById("out");

SUPER_IDS.forEach((sid, index)=>{
  const div = document.createElement("div");
  div.className = "cell";
  div.textContent = sid;
  div.dataset.index = index;

  div.addEventListener("click", ()=>{
    const r = OP15(index);
    out.textContent =
      `${r.superID} → MOVE=${r.move} | AXIS=${r.axis1}/${r.axis2} | FUNC=${r.func}`;
  });

  grid.appendChild(div);
});
</script>

</body>
</html>
