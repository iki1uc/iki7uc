<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TIME 3×11 Scroll + Zoom</title>

<style>
  .toolbar {
    width: 100%;
    text-align: center;
    margin: 10px 0;
  }

  .toolbar button {
    padding: 6px 12px;
    margin: 0 4px;
    font-size: 14px;
  }

  .scroll-container {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #444;
    padding: 10px;
    box-sizing: border-box;
  }

  .zoom-wrapper {
    transform-origin: top left;
    transition: transform 0.2s ease;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(11, 80px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    width: max-content;
  }

  .cell {
    border: 1px solid #444;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    background: #f8f8f8;
  }
</style>
</head>

<body>

<div class="toolbar">
  <button id="zoomIn">Zoom +</button>
  <button id="zoomOut">Zoom −</button>
  <button id="zoomReset">Reset</button>
</div>

<div class="scroll-container">
  <div id="zoomWrapper" class="zoom-wrapper">
    <div id="grid" class="grid"></div>
  </div>
</div>

<script>
// ------------------------------------------------------
// Zoom-Logik
// ------------------------------------------------------
let zoom = 1;

document.getElementById("zoomIn").onclick = () => {
  zoom = Math.min(zoom + 0.1, 3);
  applyZoom();
};

document.getElementById("zoomOut").onclick = () => {
  zoom = Math.max(zoom - 0.1, 0.3);
  applyZoom();
};

document.getElementById("zoomReset").onclick = () => {
  zoom = 1;
  applyZoom();
};

function applyZoom(){
  document.getElementById("zoomWrapper").style.transform = `scale(${zoom})`;
}

// ------------------------------------------------------
// Renderer für 3×11
// ------------------------------------------------------
function render3x11(mask){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for(let r=1; r<=3; r++){
    for(let c=1; c<=11; c++){
      const cell = document.createElement("div");
      cell.className = "cell";

      const hit = mask.find(s => s.pos[0] === r && s.pos[1] === c);
      cell.textContent = hit ? hit.ref : "";
      grid.appendChild(cell);
    }
  }
}

// ------------------------------------------------------
// Beispiel: TIME‑3×11 present‑Zone
// ------------------------------------------------------
const timeExample = [
  { pos:[1,4], refs:["M-001"] },
  { pos:[2,5], refs:["M-017","M-023"], phase:[0.2,0.7] },
  { pos:[3,2], refs:["M-099"] },
  { pos:[1,10], refs:["M-777"] }
];

// 3×11 erzeugen
const mask3x11 = timeExample.map(s => ({
  pos: s.pos,
  ref: s.refs?.[0] || s.ref || "?",
  phase: s.phase || null
}));

// Rendern
render3x11(mask3x11);
</script>

</body>
</html>
