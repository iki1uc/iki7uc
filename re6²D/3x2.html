<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3×2 – Vorwärts‑Operator</title>
<style>
  body{background:#000;color:#0ff;font-family:monospace;padding:20px;}
  .cell{padding:6px;margin:4px;border:1px solid #033;display:inline-block;width:90px;text-align:center;cursor:pointer;}
</style>
</head>
<body>

<h2>3×2 – VORWÄRTS‑OPERATOR</h2>
<div id="grid"></div>
<pre id="out">READY</pre>

<script>
// SUPER-ID (6 Felder + TAT2 Erweiterung)
const SUPER_IDS = ["⟡A1","⟡A2","⟡B1","⟡B2","⟡C1","⟡C2","F0","F1"];

// Moves (minimal + TAT2 Erweiterung)
const MOVES = {
  "⟡A1":"AN","⟡A2":"SC",
  "⟡B1":"NV","⟡B2":"ST",
  "⟡C1":"SG","⟡C2":"HX",
  "F0":"F0⁺¹",   // TAT2 NEU
  "F1":"F1⁺¹"    // TAT2 NEU
};

// Achsen (1D/2D/3D-konform)
const AXIS_PRIMARY   = ["I","I","Z","Z","W","W","F","F"];
const AXIS_SECONDARY = ["K","T"];

// Flow + TAT2 Erweiterung
const FLOW = {
  AN:"SC", SC:"NV", NV:"ST", ST:"SG", SG:"HX", HX:"END",
  "F0⁺¹":"F0",   // TAT2 NEU
  "F1⁺¹":"F1"    // TAT2 NEU
};

// Operator
function OP(i){
  const sid  = SUPER_IDS[i];
  const move = MOVES[sid];
  const row  = Math.floor(i/2);
  const col  = i%2;
  return {
    sid,
    move,
    axis1: AXIS_PRIMARY[i],
    axis2: AXIS_SECONDARY[col] || "K",
    flow: FLOW[move]
  };
}

// UI
const grid=document.getElementById("grid");
const out=document.getElementById("out");
SUPER_IDS.forEach((sid,i)=>{
  const d=document.createElement("div");
  d.className="cell";
  d.textContent=sid;
  d.onclick=()=>{const r=OP(i);out.textContent=`${r.sid}\n${r.move}\n${r.axis1}/${r.axis2}\n→ ${r.flow}`};
  grid.appendChild(d);
});
</script>

</body>
</html>
