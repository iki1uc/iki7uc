<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3×1 – Rückwärts‑Operator</title>
<style>
  body{background:#000;color:#0ff;font-family:monospace;padding:20px;}
  .cell{padding:6px;margin:4px;border:1px solid #033;display:inline-block;width:90px;text-align:center;cursor:pointer;}
</style>
</head>
<body>

<h2>3×1 – RÜCKWÄRTS‑OPERATOR</h2>
<div id="grid"></div>
<pre id="out">READY</pre>

<script>
// SUPER-ID (3 Felder + TAT1 Erweiterung)
const SUPER_IDS = ["⟡A1","⟡B1","⟡C1","R0","R1"];

// Moves (inverse + TAT1 Erweiterung)
const MOVES = {
  "⟡A1":"AN⁻¹",
  "⟡B1":"NV⁻¹",
  "⟡C1":"SG⁻¹",
  "R0":"R0⁻¹",   // TAT1 NEU
  "R1":"R1⁻¹"    // TAT1 NEU
};

// Achsen
const AXIS_PRIMARY   = ["I","Z","W","R","R"]; 
// 1D/2D/3D-konform: R0/R1 bekommen eigene Primärachse

const AXIS_SECONDARY = ["R"]; // Rückwärts-Achse bleibt gleich

// Inverser Flow + TAT1 Erweiterung
const FLOW_INV = {
  "AN⁻¹":"END",
  "NV⁻¹":"AN",
  "SG⁻¹":"NV",
  "R0⁻¹":"R0",   // TAT1 NEU
  "R1⁻¹":"R1"    // TAT1 NEU
};

// Operator
function OP_INV(i){
  const sid  = SUPER_IDS[i];
  const move = MOVES[sid];
  return {
    sid,
    move,
    axis1: AXIS_PRIMARY[i],
    axis2: AXIS_SECONDARY[0],
    flow: FLOW_INV[move]
  };
}

// UI
const grid=document.getElementById("grid");
const out=document.getElementById("out");
SUPER_IDS.forEach((sid,i)=>{
  const d=document.createElement("div");
  d.className="cell";
  d.textContent=sid;
  d.onclick=()=>{const r=OP_INV(i);out.textContent=`${r.sid}\n${r.move}\n${r.axis1}/${r.axis2}\n→ ${r.flow}`};
  grid.appendChild(d);
});
</script>

</body>
</html>
