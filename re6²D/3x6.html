<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3×6 – RAWWATOR SCHALTWERK</title>
<style>
  body{
    margin:0;
    background:#000;
    color:#0ff;
    font-family:monospace;
    padding:20px;
  }
  .cell{
    padding:6px;
    margin:4px;
    border:1px solid #033;
    display:inline-block;
    width:90px;
    text-align:center;
    cursor:pointer;
  }
</style>
</head>
<body>

<h2>3×6 SCHALTWERK</h2>
<div id="grid"></div>
<pre id="out">READY</pre>

<script>
// ======================================================
// SUPER-ID (⟡ + 2 Zeichen)
// ======================================================
const SUPER_IDS = [
  "⟡A1","⟡A2","⟡A3","⟡A4","⟡A5","⟡A6",
  "⟡B1","⟡B2","⟡B3","⟡B4","⟡B5","⟡B6",
  "⟡C1","⟡C2","⟡C3","⟡C4","⟡C5","⟡C6"
];

// ======================================================
// MOVE-SET (18 Schaltungen)
// ======================================================
const MOVES = {
  "⟡A1":"AN","⟡A2":"SC","⟡A3":"NV","⟡A4":"ST","⟡A5":"SG","⟡A6":"HX",
  "⟡B1":"MX","⟡B2":"IQ","⟡B3":"AL","⟡B4":"SH","⟡B5":"CU","⟡B6":"MO",
  "⟡C1":"PI","⟡C2":"AX","⟡C3":"BC","⟡C4":"RW","⟡C5":"ER","⟡C6":"IQ"
};

// ======================================================
// ACHSEN (3 × 6 = 18 Kombinationen)
// ======================================================
const AXIS_PRIMARY   = ["I","Z","W"];
const AXIS_SECONDARY = ["K","T","P","R","S","E"];

// ======================================================
// DURCHLAUF-KETTE (Schaltung → Weiterleitung)
// ======================================================
const FLOW = {
  AN:"ST", SC:"AL", NV:"PI", ST:"IQ", SG:"AL", HX:"END",
  MX:"MO", IQ:"CU", AL:"AX", SH:"PI", CU:"RW", MO:"END",
  PI:"IQ", AX:"END", BC:"RW", RW:"END", ER:"RW"
};

// ======================================================
// OPERATOR-FORMEL (Master)
// ======================================================
function OP(index){
  const sid  = SUPER_IDS[index];
  const move = MOVES[sid];

  const row = Math.floor(index / 6);
  const col = index % 6;

  const axis1 = AXIS_PRIMARY[row];
  const axis2 = AXIS_SECONDARY[col];

  const chain = FLOW[move];

  return { sid, move, axis1, axis2, chain };
}

// ======================================================
// UI (minimal, nur zum Anklicken der Schaltung)
// ======================================================
const grid = document.getElementById("grid");
const out  = document.getElementById("out");

SUPER_IDS.forEach((sid, index)=>{
  const div = document.createElement("div");
  div.className = "cell";
  div.textContent = sid;
  div.onclick = ()=>{
    const r = OP(index);
    out.textContent =
      `${r.sid}\nMOVE=${r.move}\nAXIS=${r.axis1}/${r.axis2}\nFLOW=${r.chain}`;
  };
  grid.appendChild(div);
});
</script>

</body>
</html>
