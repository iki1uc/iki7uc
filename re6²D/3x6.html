<script>
// ======================================================
// VIER-SCHICHTEN-SLOTS (R°, F°, L°, E°)
// ======================================================
window.lastR = window.lastR || null;
window.lastF = window.lastF || null;
window.lastL = window.lastL || null;
window.lastE = window.lastE || null;

// ======================================================
// BORG PROTOCOL – GEN VERSION
// ======================================================
function borgProtocol(r){
  const result = { status:"OK", action:"", message:"" };

  // Flow MUSS existieren (3×6 ist Flow-Schaltwerk)
  if(!r.chain){
    result.status = "ERROR";
    result.action = "ADD_FLOW";
    result.message = "Flow fehlt. Schaltwerk unvollständig.";
    return result;
  }

  // Achsen prüfen
  if(!r.axis1 || !r.axis2){
    result.status = "ERROR";
    result.action = "ADD_AXIS";
    result.message = "Achsenkohärenz fehlt. Struktur instabil.";
    return result;
  }

  // Kritische Moves
  if(r.move === "NV" || r.move === "SG" || r.move === "HX"){
    result.status = "WARN";
    result.action = "CHECK_PATH";
    result.message = "Kritischer Move. Pfad prüfen.";
    return result;
  }

  // Stabile Moves
  if(r.move === "AN" || r.move === "SC" || r.move === "ST" || r.move === "END"){
    result.status = "OK";
    result.action = "CONTINUE";
    result.message = "Schaltwerk stabil.";
    return result;
  }

  // Default
  result.status = "INFO";
  result.action = "ANALYZE";
  result.message = "Analyse läuft.";
  return result;
}

// ======================================================
// VIER-SCHICHTEN-KERN (GEN-X)
// ======================================================
function vierSchichtenKern(r){
  const R = r.R ? "OK" : "MISS";
  const F = r.F ? "OK" : "MISS";
  const L = r.L ? "OK" : "MISS";
  const E = r.E ? "OK" : "MISS";

  const full = (R==="OK" && F==="OK" && L==="OK" && E==="OK");

  return {
    R, F, L, E,
    status: full ? "FULL" : "PARTIAL",
    message: full
      ? "GEN-X aktiv. System schwebt."
      : "GEN-X unvollständig."
  };
}
