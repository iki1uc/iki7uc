<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>33% UI – Achsen Engine</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: white;
        font-family: Arial;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* 33% UI – 3 farbige Zonen */
    #ui {
        display: flex;
        width: 100%;
        height: 33vh;
    }

    #zoneA { width: 33.33%; background: rgba(255,0,0,0.15); }
    #zoneB { width: 33.33%; background: rgba(0,255,0,0.15); }
    #zoneC { width: 33.33%; background: rgba(0,200,255,0.15); }

    /* Canvas Bereich */
    #canvasWrap {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
    }

    /* Buttons */
    #controls {
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background: #111;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        background: #333;
        color: white;
        border: 1px solid #555;
        cursor: pointer;
    }

    button:hover {
        background: #555;
    }
</style>
</head>

<body>

<!-- 33% UI -->
<div id="ui">
    <div id="zoneA"></div>
    <div id="zoneB"></div>
    <div id="zoneC"></div>
</div>

<!-- Canvas -->
<div id="canvasWrap">
    <canvas id="uiCanvas" width="900" height="300"></canvas>
</div>

<!-- Buttons -->
<div id="controls">
    <button onclick="setMode('A')">A</button>
    <button onclick="setMode('B')">B</button>
    <button onclick="setMode('C')">C</button>
</div>

<script>
const canvas = document.getElementById("uiCanvas");
const ctx = canvas.getContext("2d");

let ax = 0;
let by = 0;
let cz = 0;

function setMode(mode) {
    if (mode === "A") ax += 10;
    if (mode === "B") by += 10;
    if (mode === "C") cz += 10;
    drawAxes();
}

function drawAxes() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = canvas.width / 3;
    const h = canvas.height;

    // A – links
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(ax * Math.PI/180);
    ctx.strokeStyle = "red";
    ctx.beginPath();
    ctx.moveTo(-50, 0);
    ctx.lineTo(50, 0);
    ctx.stroke();
    ctx.restore();

    // B – mitte
    ctx.save();
    ctx.translate(w + w/2, h/2);
    ctx.rotate(by * Math.PI/180);
    ctx.strokeStyle = "lime";
    ctx.beginPath();
    ctx.moveTo(-50, 0);
    ctx.lineTo(50, 0);
    ctx.stroke();
    ctx.restore();

    // C – rechts
    ctx.save();
    ctx.translate(2*w + w/2, h/2);
    ctx.rotate(cz * Math.PI/180);
    ctx.strokeStyle = "cyan";
    ctx.beginPath();
    ctx.moveTo(-50, 0);
    ctx.lineTo(50, 0);
    ctx.stroke();
    ctx.restore();
}

drawAxes();
</script>

</body>
</html>
