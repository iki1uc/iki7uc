<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3×3 Maske – UPG‑X</title>

<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 300px;
    margin: 20px auto;
  }
  .cell {
    border: 1px solid #444;
    padding: 12px;
    text-align: center;
    min-height: 40px;
    font-family: sans-serif;
  }
</style>
</head>

<body>

<div id="grid" class="grid"></div>

<script>
// ------------------------------------------------------
// 3×X → 3×3 Schnitt
// ------------------------------------------------------
function slice3x3(slots){
  return slots.filter(s => s.pos[1] <= 3);
}

// ------------------------------------------------------
// Renderer
// ------------------------------------------------------
function render3x3(mask){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for(let r=1; r<=3; r++){
    for(let c=1; c<=3; c++){
      const cell = document.createElement("div");
      cell.className = "cell";

      const hit = mask.find(s => s.pos[0] === r && s.pos[1] === c);
      cell.textContent = hit ? (hit.ref || hit.k || "?") : "";
      grid.appendChild(cell);
    }
  }
}

// ------------------------------------------------------
// Beispiel: TIME‑3×11 present‑Zone
// ------------------------------------------------------
const example = [
  { pos:[2,5], refs:["M-017","M-023"], phase:[0.2,0.7] }
];

// 3×3 erzeugen
const mask3x3 = slice3x3(example);

// Rendern
render3x3(mask3x3);
</script>

</body>
</html>
