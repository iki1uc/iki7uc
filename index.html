<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SEEÜ UI</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Toolbar mit alten Tasten */
  .toolbar {
    height: 60px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .toolbar button {
    padding: 10px 20px;
    font-size: 18px;
    background: #222;
    border: 1px solid #555;
    color: #fff;
    cursor: pointer;
  }

  /* 33% UI-Bereich */
  #uiZone {
    height: 33%;
    background: #000;
    border-top: 1px solid #333;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Restlicher Bereich */
  #mainZone {
    flex: 1;
    background: #000;
  }
</style>
</head>

<body>

<!-- Alte Tasten -->
<div class="toolbar">
  <button onclick="setMode('A')">A</button>
  <button onclick="setMode('B')">B</button>
  <button onclick="setMode('C')">C</button>
</div>

<!-- 33% UI -->
<div id="uiZone">
  <canvas id="uiCanvas" width="400" height="200"></canvas>
</div>

<!-- Restlicher Bereich -->
<div id="mainZone"></div>

<script src="engine.js"></script>

</body>
</html>
