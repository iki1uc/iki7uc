<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>UI START</title>

<style>
  body {
    margin: 0;
    background: #000;
    font-family: sans-serif;
  }

  .toolbar {
    padding: 10px;
    display: flex;
    gap: 10px;
    justify-content: center;
    background: #111;
  }

  .toolbar button {
    padding: 10px 20px;
    font-size: 18px;
    background: #222;
    border: 1px solid #555;
    color: #fff;
    cursor: pointer;
  }

  #mainUI {
    height: calc(100vh - 60px);
    background: #000;
    position: relative;
    overflow: hidden;
  }

  #topLine {
    position: absolute;
    top: 10px;
    left: 10px;
  }

  #bottomLine1 {
    position: absolute;
    bottom: 10px;
    left: 10px;
  }

  #bottomLine2 {
    position: absolute;
    bottom: 10px;
    right: 10px;
  }
</style>
</head>

<body>

<!-- ⭐ 3 BUTTONS SOFORT SICHTBAR ⭐ -->
<div class="toolbar">
  <button onclick="setMode('A')">A</button>
  <button onclick="setMode('B')">B</button>
  <button onclick="setMode('C')">C</button>
</div>

<!-- ⭐ UI-BEREICH FÜR DEINE ENGINE ⭐ -->
<div id="mainUI">
  <div id="topLine"></div>
  <canvas id="bottomLine1" width="300" height="80"></canvas>
  <svg id="bottomLine2" width="300" height="80"></svg>
</div>

<!-- ⭐ DEINE ENGINE LADEN ⭐ -->
<script src="engine.js"></script>

</body>
</html>
