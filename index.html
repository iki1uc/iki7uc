<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>UI START</title>

<style>
  body {
    margin: 0;
    background: #000;
    font-family: sans-serif;
  }

  .toolbar {
    padding: 10px;
    display: flex;
    gap: 10px;
    justify-content: center;
    background: #111;
  }

  .toolbar button {
    padding: 10px 20px;
    font-size: 18px;
    background: #222;
    border: 1px solid #555;
    color: #fff;
    cursor: pointer;
  }

  #mainUI {
    height: calc(100vh - 60px);
    background: #000;
    position: relative;
    overflow: hidden;
  }

  /* UNSICHTBARES GRID FÜR tam() */
  #gridContainer {
    display: grid;
    grid-template-columns: repeat(11, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    position: absolute;
    top: 10px;
    right: 10px;
    opacity: 0; /* UNSICHTBAR */
    pointer-events: none;
  }

  .gcell {
    width: 40px;
    height: 40px;
    background: #222;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="setMode('A')">A</button>
  <button onclick="setMode('B')">B</button>
  <button onclick="setMode('C')">C</button>
</div>

<div id="mainUI">
  <div id="topLine"></div>
  <canvas id="bottomLine1" width="300" height="80"></canvas>
  <svg id="bottomLine2" width="300" height="80"></svg>

  <!-- UNSICHTBARES GRID FÜR tam() -->
  <div id="gridContainer"></div>
</div>

<script src="engine.js"></script>

<script>
// GRID AUFBAU (3x11)
const grid = {};
const gridContainer = document.getElementById("gridContainer");

for (let r = 1; r <= 3; r++) {
  for (let c = 1; c <= 11; c++) {
    const id = `r${r}c${c}`;
    const cell = document.createElement("div");
    cell.className = "gcell";
    cell.id = id;
    grid[id] = cell;
    gridContainer.appendChild(cell);
  }
}
</script>

</body>
</html>
