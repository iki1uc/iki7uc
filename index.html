<script>
async function loadSystem() {

  // 1) Alle Dateien definieren
  const files = [
    "transwarp/math2me_richtung.json",
    "transwarp/math2me_modus.json",
    "transwarp/math2me_matrix.json",
    "transwarp/2memath_massnahmen.json",
    "transwarp/2memath_zeitfenster.json",
    "transwarp/2memath_primabweichung.json",
    "beam/u4beam_pidrift.json",
    "beam/u4beam_interferenz.json",
    "beam/beam4u_ablichtung.json"
  ];

  // 2) Laden aller Dateien
  const items = [];
  for (const f of files) {
    const r = await fetch(f);
    const j = await r.json();
    j.file = f;        // Name → Selbst-Erklärbarkeit
    items.push(j);
  }

  // 3) mini/maxi erklären
  const modus = items.find(i => i.file.includes("modus"));
  const miniMaxi = modus?.sache || "unbekannt";

  document.getElementById("modus").textContent =
    "Modus: " + miniMaxi + " (aus math2me_modus.json)";

  // 4) 3×13-Grid erzeugen
  const grid = document.getElementById("grid");
  items.forEach(i => {
    const cell = document.createElement("div");
    cell.className = "cell";

    cell.innerHTML = `
      <b>${i.file}</b><br>
      Achse: ${i.axis}<br>
      Sache: ${i.sache}<br>
      Zeit: ${i.zeit}<br>
      Essenz: ${i.essenz}<br>
      Künstler: ${i.kuenstler.join(", ")}
    `;

    grid.appendChild(cell);
  });
}
</script>
