<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>3×3 Wahrheiten</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 300px;
            margin: 20px auto;
        }
        .cell {
            border: 1px solid #444;
            padding: 12px;
            text-align: center;
            min-height: 40px;
            font-family: sans-serif;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<div class="grid">
    <div id="r0c0" class="cell"></div>
    <div id="r0c1" class="cell"></div>
    <div id="r0c2" class="cell"></div>

    <div id="r1c0" class="cell"></div>
    <div id="r1c1" class="cell"></div>
    <div id="r1c2" class="cell"></div>

    <div id="r2c0" class="cell"></div>
    <div id="r2c1" class="cell"></div>
    <div id="r2c2" class="cell"></div>
</div>

<button id="btn">9 Wahrheiten beamen</button>

<script src="6iy.js"></script>
</body>
</html>
