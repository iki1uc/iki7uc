<script>
// STATE SPEICHERN / LADEN
function loadState(){
    return JSON.parse(localStorage.getItem("calc_state")) || { value: 10, mult: 1 };
}
function saveState(state){
    localStorage.setItem("calc_state", JSON.stringify(state));
}

// FORCALC (3×2)
function forcalc(state){
    return {
        axis: "3x2",
        direction: "forward",
        value: state.value,
        raw: state.raw ?? null,
        mult: state.mult ?? 1
    };
}

// REVCALC (3×1)
function revcalc(state){
    return {
        axis: "3x1",
        direction: "backward",
        value: state.value,
        raw: state.raw ?? null,
        mult: state.mult ?? 1
    };
}

// RCALC (Router)
function rcalc(event){
    const state = event.state ?? {};
    if(event.direction === "forward"){
        return { mode: "forward", result: forcalc(state) };
    }
    if(event.direction === "backward"){
        return { mode: "backward", result: revcalc(state) };
    }
    return { mode: "neutral", result: state };
}

// REAL_MATCH (Dispatcher)
function real_match(event){
    const state = event.state ?? event;
    const direction = event.direction ?? "neutral";
    const routed = rcalc({ direction: direction, state: state });
    return { input: state, mode: routed.mode, output: routed.result };
}

// TEST BUTTONS
function testForward(){
    let state = loadState();
    state.value += 1;
    saveState(state);
    print(real_match({ direction: "forward", state: state }));
}
function testBackward(){
    let state = loadState();
    state.value -= 1;
    saveState(state);
    print(real_match({ direction: "backward", state: state }));
}
function testNeutral(){
    let state = loadState();
    print(real_match({ direction: "neutral", state: state }));
}

// OUTPUT
function print(obj){
    document.getElementById("out").textContent =
        JSON.stringify(obj, null, 4);
}
</script>
