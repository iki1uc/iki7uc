function rcalc(event){
    const state = event.state ?? {};

    if(event.direction === "forward"){
        return {
            mode: "forward",
            result: forcalc(state)
        };
    }

    if(event.direction === "backward"){
        return {
            mode: "backward",
            result: revcalc(state)
        };
    }

    return {
        mode: "neutral",
        result: state
    };
}
