<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>3×Märchen ×4 – PURE Engine</title>
  <style>
    body {
      background: #000;
      color: #0ff;
      font-family: monospace;
      padding: 20px;
    }
    #meta { margin-bottom: 10px; color: #aaa; }
    #storyBox {
      white-space: pre-wrap;
      border: 1px solid #0ff;
      padding: 10px;
      min-height: 160px;
    }
    button { margin-top: 10px; padding: 6px 12px; }
  </style>
</head>
<body>

<div id="meta"></div>
<div id="storyBox"></div>
<button id="nextBtn">Weiter</button>

<script>
// --- 1) MÄRCHEN ---
const stories = {
  rew: `MÄRCHEN 1 – Rückwärts

Es war einmal ein Wanderer,
der immer nur rückwärts ging.

Eines Tages stolperte er über einen Stein.

Da erkannte er:
"Wer nur zurückschaut, sieht nicht, wohin er fällt."`,

  me: `MÄRCHEN 2 – Mitte

Es war einmal ein Kind,
das fragte, warum Sterne funkeln.

Die Mutter sagte:
"Weil jede Frage ein Licht entzündet."

Und so begann das Kind zu verstehen.`,

  for: `MÄRCHEN 3 – Vorwärts

Ein Mann saß unter einem Apfelbaum.
Ein Apfel fiel und traf ihn leicht am Kopf.

Er dachte:
"Zum Glück war es kein Kürbis."

Und so begann seine Reise der Erkenntnis.`
};

// --- 2) 3×4 SEQUENZ ---
const keys = ["rew", "me", "for"];
const sequence = [];

for (let r = 1; r <= 4; r++) {
  for (let k of keys) {
    sequence.push({
      key: k,
      round: r,
      text: stories[k]
    });
  }
}

// --- 3) ZUSTAND ---
let index = 0;

// --- 4) ANZEIGE ---
function render() {
  const meta = document.getElementById("meta");
  const box  = document.getElementById("storyBox");

  if (index < sequence.length) {
    const item = sequence[index];
    meta.textContent = `Slot ${index+1}/12 | ${item.key} | Runde ${item.round}`;
    box.textContent  = item.text;
  } else {
    meta.textContent = `Slot ${index+1} | OUT_OF_RANGE`;
    box.textContent  = `Auch diese falsche Anzeige ist ein Signal.`;
  }
}

document.getElementById("nextBtn").addEventListener("click", () => {
  index++;
  render();
});

// --- START ---
render();
</script>

</body>
</html>
