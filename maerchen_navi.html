<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Märchen-Navi 360°</title>
    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .nav button {
            background: #0f0;
            color: #111;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .nav button:hover {
            background: #9f9;
        }
        #story, #zoomState, #genState {
            border: 1px solid #0f0;
            padding: 20px;
            white-space: pre-wrap;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Märchen-Navigation 360°</h1>

<div class="nav">
    <button onclick="setAxis('rew')">rew</button>
    <button onclick="setAxis('me')">me</button>
    <button onclick="setAxis('for')">for</button>
</div>

<div id="story">Wähle oben ein Märchen…</div>
<div id="zoomState"></div>
<div id="genState"></div>
