#scanHelper {
  position: fixed;
  top: 6px;
  right: 8px;
  display: flex;
  gap: 4px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  opacity: 0.25;
  z-index: 9999;
}

#scanHelper a {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid #666;
  color: #ccc;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#scanHelper a:hover {
  opacity: 1;
  border-color: #fff;
  color: #fff;
}
